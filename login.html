<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ingresar — Bitácora de Rodeo</title>
  <link rel="icon" type="image/png" href="img/branding/BIT-favicon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Fredoka:wght@500;600;700&family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/login.css">
</head>
<body class="login-body">

  <div class="login-card">
    <img class="login-logo" src="img/branding/BIT-logo-isotipo-transparente.png" alt="Bitácora de Rodeo">
    <div class="login-appname">Bitácora de Rodeo</div>

    <form id="login-form" novalidate>
      <label class="form-label" for="login-email">Email</label>
      <input class="form-field" type="email" id="login-email" autocomplete="username" required>

      <label class="form-label" for="login-password">Contraseña</label>
      <div class="password-field-wrapper">
        <input class="form-field" type="password" id="login-password" autocomplete="current-password" required>
        <button type="button" class="password-toggle" id="toggle-password" aria-label="Mostrar contraseña">
          <svg class="eye-show" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
          <svg class="eye-hide" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="display:none">
            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
            <line x1="1" y1="1" x2="23" y2="23"/>
          </svg>
        </button>
      </div>

      <div class="login-error" id="login-error"></div>

      <button type="submit" class="salida-btn" id="login-submit">Ingresar</button>
    </form>
  </div>

  <script type="module" src="js/login.js"></script>
</body>
</html>
